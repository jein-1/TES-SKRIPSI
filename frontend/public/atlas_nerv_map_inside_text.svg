<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0c1017"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>

    <!-- NERV Wing Gradient -->
    <linearGradient id="wingGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B00"/>
      <stop offset="100%" stop-color="#B30000"/>
    </linearGradient>
    <linearGradient id="wingGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6A00"/>
      <stop offset="100%" stop-color="#D61800"/>
    </linearGradient>
    <linearGradient id="wingGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA040"/>
      <stop offset="100%" stop-color="#E63900"/>
    </linearGradient>

    <!-- Indonesia Topography Gradient inside Text -->
    <linearGradient id="indoGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="35%" stop-color="#FFA726"/>
      <stop offset="65%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>

    <!-- Clip Path for the Letters A.T.L.A.S -->
    <clipPath id="atlasTextClip">
      <text x="500" y="690" text-anchor="middle" font-family="'JetBrains Mono', 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="142" letter-spacing="12">A.T.L.A.S</text>
    </clipPath>

    <!-- Subtle Glow Filter -->
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Black Matte Background -->
  <rect width="1000" height="1000" fill="url(#bgGrad)"/>

  <!-- Outer Tactical Border & Reticles -->
  <rect x="30" y="30" width="940" height="940" rx="36" fill="none" stroke="#FF5722" stroke-width="2" stroke-opacity="0.25"/>
  <rect x="42" y="42" width="916" height="916" rx="28" fill="none" stroke="#FF5722" stroke-width="1" stroke-dasharray="12 8" stroke-opacity="0.2"/>
  <circle cx="500" cy="500" r="440" fill="none" stroke="#FF5722" stroke-width="1" stroke-opacity="0.1" stroke-dasharray="4 12"/>
  
  <!-- Corner Reticle Marks -->
  <path d="M 50 80 L 50 50 L 80 50" fill="none" stroke="#FF5722" stroke-width="3"/>
  <path d="M 950 80 L 950 50 L 920 50" fill="none" stroke="#FF5722" stroke-width="3"/>
  <path d="M 50 920 L 50 950 L 80 950" fill="none" stroke="#FF5722" stroke-width="3"/>
  <path d="M 950 920 L 950 950 L 920 950" fill="none" stroke="#FF5722" stroke-width="3"/>

  <!-- ─── UPPER CREST: NERV-STYLE TACTICAL WINGS ─── -->
  <g transform="translate(500, 310)" filter="url(#glowOrange)">
    <!-- Segment 1 (Base leaf/feather) -->
    <path d="M -180 80 C -120 -80 -20 -180 180 -220 C 130 -140 70 -60 10 20 C -60 40 -120 70 -180 80 Z" fill="url(#wingGrad1)"/>
    <!-- Segment 2 (Middle wing tier) -->
    <path d="M -150 95 C -60 -10 50 -120 220 -150 C 170 -80 100 0 30 70 C -30 85 -90 92 -150 95 Z" fill="url(#wingGrad2)"/>
    <!-- Segment 3 (Lower feather tier) -->
    <path d="M -110 110 C -20 20 100 -50 250 -70 C 190 -10 120 50 50 110 C 0 112 -60 112 -110 110 Z" fill="url(#wingGrad3)"/>
    <!-- Central Sharp Incline Divider Line -->
    <path d="M -185 85 L 255 -70" stroke="#05070B" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- ─── MIDDLE: TEXT "A.T.L.A.S" WITH INDONESIA GEOGRAPHY MASKED INSIDE ─── -->
  <!-- 1. Background layer of the letters (dark glass fill so letter shape is clear) -->
  <text x="500" y="690" text-anchor="middle" font-family="'JetBrains Mono', 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="142" letter-spacing="12" fill="#141a24" stroke="#FF5722" stroke-width="4" stroke-opacity="0.8"/>

  <!-- 2. Indonesian Archipelago Geography Rendered INSIDE the Letters -->
  <g clip-path="url(#atlasTextClip)">
    <!-- Deep glowing background inside letters -->
    <rect x="0" y="520" width="1000" height="220" fill="#090d14"/>

    <!-- Radar Grid Latitude/Longitude Lines inside letters -->
    <line x1="0" y1="580" x2="1000" y2="580" stroke="#FF5722" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="8 6"/>
    <line x1="0" y1="630" x2="1000" y2="630" stroke="#FF5722" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="0" y1="680" x2="1000" y2="680" stroke="#FF5722" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="8 6"/>
    <line x1="250" y1="520" x2="250" y2="740" stroke="#FF5722" stroke-width="1" stroke-opacity="0.25"/>
    <line x1="500" y1="520" x2="500" y2="740" stroke="#FF5722" stroke-width="1" stroke-opacity="0.35"/>
    <line x1="750" y1="520" x2="750" y2="740" stroke="#FF5722" stroke-width="1" stroke-opacity="0.25"/>

    <!-- Detailed Vector Map of Indonesian Archipelago Islands -->
    <!-- Pulau Sumatera -->
    <path d="M 120 570 Q 150 590 190 625 L 220 655 L 240 680 L 230 690 L 190 660 L 140 620 L 110 580 Z" fill="#FF5722" fill-opacity="0.95" stroke="#FFA726" stroke-width="2"/>
    <circle cx="165" cy="610" r="2" fill="#FFFFFF"/>
    <circle cx="210" cy="660" r="2" fill="#FFFFFF"/>

    <!-- Pulau Jawa -->
    <path d="M 255 695 Q 310 700 370 695 Q 430 690 460 690 L 460 698 Q 400 704 330 706 L 255 700 Z" fill="#FFA726" fill-opacity="0.95" stroke="#FFD54F" stroke-width="1.5"/>

    <!-- Pulau Kalimantan -->
    <path d="M 285 625 Q 330 580 395 590 Q 430 610 420 645 Q 370 665 315 655 Z" fill="#FF7043" fill-opacity="0.9" stroke="#FFAB91" stroke-width="2"/>

    <!-- Kepulauan Nusa Tenggara / Bali -->
    <path d="M 470 692 L 490 692 L 515 694 L 545 695 L 580 696" stroke="#FFA726" stroke-width="3" stroke-linecap="round"/>

    <!-- Pulau Sulawesi (Bentuk 'K' Khas Palu & Makassar) -->
    <path d="M 445 630 Q 480 600 500 620 Q 525 610 520 635 Q 495 640 485 655 Q 520 670 495 680 Q 470 660 450 645 Z" fill="#00E5FF" fill-opacity="0.95" stroke="#E0F7FA" stroke-width="2"/>
    <!-- Marker Merah Gempa Kota Palu di Leher Sulawesi -->
    <circle cx="478" cy="628" r="4" fill="#FF1744" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="478" cy="628" r="9" fill="none" stroke="#FF1744" stroke-width="1" stroke-dasharray="3 3"/>

    <!-- Kepulauan Maluku -->
    <path d="M 540 625 Q 565 615 570 635 L 560 660 L 580 675" fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Pulau Papua -->
    <path d="M 605 640 Q 640 615 680 640 Q 750 635 830 655 Q 850 685 810 695 Q 730 695 660 675 L 610 650 Z" fill="#00E676" fill-opacity="0.95" stroke="#B9F6CA" stroke-width="2"/>

    <!-- Topographic Contour Relief Waveforms inside text -->
    <path d="M 80 670 Q 250 630 450 650 T 880 630" fill="none" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 4"/>
    <path d="M 100 640 Q 300 600 500 620 T 900 600" fill="none" stroke="#FF9100" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="5 5"/>
  </g>

  <!-- 3. Crisp Outline Frame over the Text for Ultra Sharp Readability -->
  <text x="500" y="690" text-anchor="middle" font-family="'JetBrains Mono', 'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="142" letter-spacing="12" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- ─── SUBTITLE: FULL OFFICIAL SYSTEM NAME ─── -->
  <g transform="translate(500, 755)">
    <rect x="-380" y="-22" width="760" height="36" rx="6" fill="#000000" stroke="#FF5722" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="0" y="2" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="16" font-weight="700" fill="#FF5722" letter-spacing="4">
      AUTONOMOUS THREAT LOCATION &amp; ALERT SYSTEM
    </text>
  </g>

  <!-- Bottom System Status Tag -->
  <text x="500" y="815" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#60728c" letter-spacing="3">
    INDONESIAN DISASTER DEFENSE NETWORK // DEFCON-1 VERIFIED
  </text>
</svg>
